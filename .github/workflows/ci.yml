      - name: Victory-condition tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_victory.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_victory
