          g++ -std=c++20 -O2 -Isrc tools/test_territory_decay.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_territory_decay
          /tmp/test_territory_decay

      - name: Map trigger tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_triggers.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_triggers
          /tmp/test_triggers

      - name: Building steering scenarios
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_building_steering.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_building_steering
          /tmp/test_building_steering

      - name: Unit pushing scenarios
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_unit_pushing.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_unit_pushing
          /tmp/test_unit_pushing

      - name: Siege packing scenarios
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_pack.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_pack
          /tmp/test_pack

      - name: Fauna and hunting tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_fauna.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_fauna
          /tmp/test_fauna

      - name: Gaia data is generated from 0 A.D. (header has every species)
        run: grep -q "FAUNA_COUNT = 61" src/simulation/gaia_data.h

      - name: Unit orders, stances and capture scenarios
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_unit_orders.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_unit_orders
          /tmp/test_unit_orders

      - name: Loot and experience scenarios
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_loot.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_loot
          /tmp/test_loot

      - name: Combat scenarios (0 A.D. bonuses, restrictions, spread)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_combat.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_combat
          /tmp/test_combat
      - name: Splash scenarios (0 A.D. Attack Splash, CauseDamageOverArea)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_splash.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_splash
