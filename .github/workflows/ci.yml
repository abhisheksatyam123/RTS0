          g++ -std=c++20 -O2 -Isrc tools/test_replay.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_replay
