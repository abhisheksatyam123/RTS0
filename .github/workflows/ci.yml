name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      android:
        description: "Also build Android APK"
        type: boolean
        default: false

env:
  GODOT_RELEASE: 4.3-stable   # must match csproj Godot.NET.Sdk and installed templates
  TEMPLATES_DIR: 4.3.stable.mono     # .NET editors expect <version>.stable.mono under export_templates

jobs:
  csharp-build:
    name: Build C# solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: dotnet build RTS0.sln -c ExportRelease

  export-desktop:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: csharp-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: "Windows Desktop"
            out: build/windows/
          - name: Linux
            preset: "Linux"
            out: build/linux/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Cache Godot binaries + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            /usr/local/bin/GodotSharp
            ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}
          key: godot-${{ env.GODOT_RELEASE }}-mono-v3

      - name: Install Godot .NET + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          BIN="Godot_v${GODOT_RELEASE}_mono_linux_x86_64/Godot_v${GODOT_RELEASE}_mono_linux.x86_64"
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/godot
          sudo mv "Godot_v${GODOT_RELEASE}_mono_linux_x86_64/GodotSharp" /usr/local/bin/GodotSharp

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${TEMPLATES_DIR}
          mv templates/* ~/.local/share/godot/export_templates/${TEMPLATES_DIR}/

      - name: Install Mesa Vulkan (lavapipe) + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libgl1-mesa-dri xvfb

      - name: Import resources
        run: xvfb-run godot --path . --import

      - name: Export preset
        run: |
          mkdir -p "${{ matrix.out }}"
          xvfb-run godot --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}/RTS0"

      - name: Rename outputs per platform
        run: |
          case "${{ matrix.name }}" in
            Windows) mv "${{ matrix.out }}/RTS0" "${{ matrix.out }}/RTS0.exe" ;;
            Linux)   mv "${{ matrix.out }}/RTS0" "${{ matrix.out }}/RTS0.x86_64" ; chmod +x "${{ matrix.out }}/RTS0.x86_64" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: RTS0-${{ matrix.name }}
          path: ${{ matrix.out }}

  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    needs: csharp-build
    if: github.event_name == 'workflow_dispatch' && inputs.android == true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Godot .NET + export templates
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          BIN="Godot_v${GODOT_RELEASE}_mono_linux_x86_64/Godot_v${GODOT_RELEASE}_mono_linux.x86_64"
          chmod +x "$BIN"
          sudo mv "$BIN" /usr/local/bin/godot
          sudo mv "Godot_v${GODOT_RELEASE}_mono_linux_x86_64/GodotSharp" /usr/local/bin/GodotSharp
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${TEMPLATES_DIR}
          mv templates/* ~/.local/share/godot/export_templates/${TEMPLATES_DIR}/
          mkdir -p ~/.android
          keytool -genkeypair -keyalg RSA -alias androiddebugkey -keypass android -storepass android -validity 9999 -keystore ~/.android/debug.keystore -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12

      - name: Configure Godot editor settings
        run: |
          xvfb-run godot --editor --headless --quit || true
          python3 tools/setup_editor_settings.py

      - name: Install Android build template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${TEMPLATES_DIR}/android_source.zip -d android/build
          echo "${TEMPLATES_DIR}" > android/.build_version
          touch android/build/.gdignore
          chmod +x android/build/gradlew || true

      - name: Install Mesa Vulkan (lavapipe) + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libgl1-mesa-dri xvfb

      - name: Import + export APK
        run: |
          echo "=== ENV DEBUG ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which java || true
          java -version || true
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          apksigner --version || true
          xvfb-run godot --path . --import
          mkdir -p build/android
          xvfb-run godot --path . --export-release "Android" build/android/RTS0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RTS0-Android
          path: build/android/
