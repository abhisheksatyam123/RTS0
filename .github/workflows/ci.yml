      - name: Map size test (nav, fog and territory grids at 0 A.D. sizes)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_map_scale.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -o /tmp/test_map_scale -lpthread
          /tmp/test_map_scale

      - name: Petra AI regression (no early rush, no village-phase stall)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_petra.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_petra
          /tmp/test_petra

      - name: Technology tree tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_techs.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_techs
          /tmp/test_techs

      - name: Structure upgrade tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_upgrades.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
