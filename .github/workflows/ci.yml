        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_territory_boundary.cpp src/presentation/territory_boundary.cpp \
            -o /tmp/test_territory_boundary
          /tmp/test_territory_boundary

      - name: Formation animation variants
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_formation_variants.cpp -o /tmp/test_formation_variants
