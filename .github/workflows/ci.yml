            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_map_structures
          /tmp/test_map_structures
      - name: Statistics tests (0 A.D. StatisticsTracker for every player)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_statistics.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_statistics
          /tmp/test_statistics

      - name: Replay round-trip
