            src/network/net_host.cpp -lpthread -o /tmp/test_treasures
          /tmp/test_treasures

      - name: Unit promotion
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_promotion.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_promotion
          /tmp/test_promotion

      - name: Units that train
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_unit_trainers.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_unit_trainers
          /tmp/test_unit_trainers

      - name: Turret points on walls and outposts
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_turrets.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_turrets
          /tmp/test_turrets

      - name: Han Imperial Minister
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_minister.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_minister
          /tmp/test_minister

      - name: Capture the Relic relics
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_relics.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_relics
          /tmp/test_relics

      - name: Paired technologies
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_paired_techs.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_paired_techs
          /tmp/test_paired_techs

      - name: Resource trickle (wonder, ministry, corral)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_trickle.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_trickle
          /tmp/test_trickle

      - name: Battle detection (damage dealt to other players)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_battle_detection.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_battle_detection
          /tmp/test_battle_detection

      - name: Nav parity probe
        run: python3 tools/check_parity.py --unit nav-live

      - name: Lobby server
        run: python3 tools/test_lobby_server.py

      - name: NAT traversal (STUN, hole punching)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_nat.cpp src/network/net_host.cpp -o /tmp/test_nat
          /tmp/test_nat

      - name: Host session limits and handshake checks (MAX_CLIENTS, Server full, versions, names)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_net_host.cpp src/network/net_host.cpp -o /tmp/test_net_host
          /tmp/test_net_host

      - name: Simulation maths goes through det_math.h
        run: python3 tools/check_det_math.py

      - name: Platform-independent maths (det_math.h hash)
        run: |
          g++ -std=c++20 -O2 -ffp-contract=off -Isrc tools/test_det_math.cpp -o /tmp/test_det_math
          /tmp/test_det_math

      - name: Same match on g++ and on clang with FMA (cross-platform lockstep)
        run: python3 tools/test_cross_compiler.py

      - name: Lockstep playtest
        run: python3 tools/playtest_lockstep.py

      - name: Headless match benchmark
        run: python3 tools/bench_match.py

      - name: Sim tick benchmark (smoke run)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/bench_sim.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/bench_sim
          /tmp/bench_sim --scenario all --ticks 100 --serial

  export-desktop:
    name: Export ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-native
    # Importing ~2 GB of 0 A.D. assets takes longer than a PR check should;
    # exports run on main, tags and manual runs only.
    if: github.event_name != 'pull_request'
    timeout-minutes: 150
    # One export per platform and branch at a time, plus the newest one waiting. Merges land faster
    # than an export finishes, so without this every merge queued two more hour-long jobs.
    concurrency:
      group: export-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: "Windows Desktop"
            out: build/windows/
            platform: windows
            scons_platform: windows
          - name: Linux
            preset: "Linux"
            out: build/linux/
            platform: linux
            scons_platform: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 scons

      - name: Cache Godot binaries + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}
          key: godot-${{ env.GODOT_RELEASE }}-classic-v1

      - name: Install Godot Classic + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}
          mv templates/* ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}/

      - name: Fetch godot-cpp (for scons)
        run: |
          if [ ! -d godot-cpp ]; then
            git clone --depth 1 --branch ${{ env.GODOT_CPP_BRANCH }} https://github.com/godotengine/godot-cpp.git godot-cpp
          fi

      - name: Build GDExtension for ${{ matrix.platform }}
        run: |
          # skip_export=1: SConstruct's post-build hook would otherwise run its
          # own Godot export here; this job exports in the steps below.
          # The editor loads the template_debug lib during import/export.
          scons platform=linux target=template_debug skip_export=1 -j4
          if [ "${{ matrix.platform }}" = "linux" ]; then
            scons platform=linux target=template_release skip_export=1 -j4
          else
            # Windows cross-build from linux using mingw - fallback to linux lib for now if mingw missing
            if which x86_64-w64-mingw32-g++ >/dev/null 2>&1; then
              scons platform=windows target=template_release skip_export=1 -j4
            else
              echo "mingw not available, using linux lib as placeholder for windows export test"
              scons platform=linux target=template_release skip_export=1 -j4
              cp bin/librtso.linux.template_release.x86_64.so bin/librtso.windows.template_release.x86_64.dll || true
            fi
          fi
          ls -lh bin/

      # Godot 4.3 reimports any file whose modified time differs from its file cache, and a fresh
      # checkout gives every file a new one. Deriving each tracked file's time from its git blob id
      # keeps it the same from run to run, and still changes it when the content changes, so the
      # cached import below stays valid for every asset that didn't change.
      - name: Pin file times to file contents
        run: |
          git ls-files -s -z | python3 -c '
          import os, sys
          for rec in sys.stdin.buffer.read().split(b"\0"):
              if rec:
                  meta, path = rec.split(b"\t", 1)
                  t = 1_000_000_000 + int(meta.split()[1][:8], 16) % 100_000_000
                  os.utime(path, (t, t))
          '

      - name: Hash importable assets
        id: assets
        run: echo "hash=$(git ls-files -s assets audio project.godot | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Godot import cache
        id: import-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
            .godot/editor/filesystem_cache8
            assets/**/*.import
            audio/**/*.import
            assets/models/**/*_tex*.png
          key: godot-import-${{ env.GODOT_RELEASE }}-${{ steps.assets.outputs.hash }}
          restore-keys: godot-import-${{ env.GODOT_RELEASE }}-

      # A single Godot 4.3 import of every asset grows past 10 GB and kills the runner, so
      # tools/godot_import.py imports the assets that need it in batches.
      - name: Import resources
        timeout-minutes: 90
        run: python3 tools/godot_import.py --godot godot

      # Saved right after the import, so a failed export still keeps the import for the next run.
      - name: Save Godot import cache
        if: steps.import-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
            .godot/editor/filesystem_cache8
            assets/**/*.import
            audio/**/*.import
            assets/models/**/*_tex*.png
          key: ${{ steps.import-cache.outputs.cache-primary-key }}

      # Godot's Compatibility renderer (OpenGL: phones without Vulkan, the web) on a
      # virtual display with Mesa's llvmpipe; fails on any shader compile error.
      - name: OpenGL (Compatibility) shader check
        if: matrix.name == 'Linux'
        timeout-minutes: 30
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python3 tools/check_gl_shaders.py --godot godot

      - name: Export preset
        timeout-minutes: 30
        run: |
          mkdir -p "${{ matrix.out }}"
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}/RTS0"

      - name: Rename outputs per platform
        run: |
          case "${{ matrix.name }}" in
            Windows) mv "${{ matrix.out }}/RTS0" "${{ matrix.out }}/RTS0.exe" ;;
            Linux)   mv "${{ matrix.out }}/RTS0" "${{ matrix.out }}/RTS0.x86_64" ; chmod +x "${{ matrix.out }}/RTS0.x86_64" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: RTS0-${{ matrix.name }}
          path: ${{ matrix.out }}
          retention-days: 7

  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    needs: build-native
    if: github.event_name == 'workflow_dispatch' && inputs.android == true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      ANDROID_KEYSTORE_DEBUG_PASS: android
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build deps + SCons + NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 scons

      - name: Fetch godot-cpp
        run: |
          rm -rf godot-cpp
          git clone --depth 1 --branch ${{ env.GODOT_CPP_BRANCH }} https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Build GDExtension for Android
        run: |
          # Requires NDK via ANDROID_NDK_ROOT; Godot's SCons will pick it up
          scons platform=android target=template_release android_arch=arm64v8 -j4 || scons platform=android target=template_release -j4
          ls -lh bin/

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Godot Classic + export templates
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}
          mv templates/* ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}/
          mkdir -p ~/.android
          keytool -genkeypair -keyalg RSA -alias androiddebugkey -keypass android -storepass android -validity 9999 -keystore ~/.android/debug.keystore -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12

      - name: Configure Java symlinks & Mesa Vulkan + Xvfb
        run: |
          sudo ln -sf "$JAVA_HOME/bin/java" /usr/local/bin/java
          sudo ln -sf "$JAVA_HOME/bin/keytool" /usr/local/bin/keytool
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libgl1-mesa-dri xvfb

      - name: Install Android build template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${{ env.TEMPLATES_DIR }}/android_source.zip -d android/build || true
          echo "${TEMPLATES_DIR}" > android/.build_version 2>/dev/null || true
          touch android/build/.gdignore 2>/dev/null || true
          chmod +x android/build/gradlew || true

      - name: Import + export APK
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          python3 tools/godot_import.py --godot godot
          python3 tools/setup_editor_settings.py || true
          mkdir -p build/android
          xvfb-run godot --path . --export-debug "Android" build/android/RTS0.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RTS0-Android
          path: build/android/
          retention-days: 7
