name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      android:
        description: "Also build Android APK"
        type: boolean
        default: false

# A new push to a PR cancels that PR's older run. Other events each get their own group; their
# exports are limited per job below.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.3-stable
  TEMPLATES_DIR: 4.3.stable
  GODOT_CPP_BRANCH: 4.3

jobs:
  build-native:
    name: Build GDExtension (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # we fetch godot-cpp manually to keep shallow

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 scons

      - name: Cache godot-cpp
        id: cache-godotcpp
        uses: actions/cache@v4
        with:
          path: godot-cpp
          key: godot-cpp-${{ env.GODOT_CPP_BRANCH }}-${{ hashFiles('SConstruct') }}

      - name: Fetch godot-cpp
        if: steps.cache-godotcpp.outputs.cache-hit != 'true'
        run: |
          rm -rf godot-cpp
          git clone --depth 1 --branch ${{ env.GODOT_CPP_BRANCH }} https://github.com/godotengine/godot-cpp.git godot-cpp

      - name: Build GDExtension (template_release)
        run: |
          scons target=template_release -j4
          ls -lh bin/

      # Artifacts are for downloads from main/tags/manual runs only. PR runs skip
      # them, and a full artifact quota must not fail an otherwise green build.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: gdextension-linux
          path: bin/
          retention-days: 3

  headless-tests:
    name: Headless C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (nav, maths, civ rosters)
        run: |
          for t in test_long_pathfinder test_fixed test_geometry test_rasterize test_vertex_pathfinder; do
            g++ -std=c++20 -O2 -Isrc tools/$t.cpp -o /tmp/$t
            /tmp/$t
          done

      - name: Civ roster tests (spawns map-only units through the simulation)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_civ_roster.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_civ_roster
          /tmp/test_civ_roster

      - name: Hotkey table tests (0 A.D. default.cfg)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_hotkeys.cpp src/presentation/hotkeys.cpp -o /tmp/test_hotkeys
          /tmp/test_hotkeys

      - name: Snap to edges tests (0 A.D. ObstructionSnap.js)
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_obstruction_snap.cpp -o /tmp/test_obstruction_snap
          /tmp/test_obstruction_snap

      - name: Per-player economy tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_players.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_players
          /tmp/test_players

      - name: Resign tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_resign.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_resign
          /tmp/test_resign

      - name: Tribute, barter and trade tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_trade.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_trade
          /tmp/test_trade

      - name: Naval tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_naval.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_naval
          /tmp/test_naval
      - name: Dropsite sharing tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_dropsite_sharing.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_dropsite_sharing
          /tmp/test_dropsite_sharing
      - name: Gather parity tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_gather_parity.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_gather_parity
          /tmp/test_gather_parity
      - name: Placement tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_placement.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_placement
          /tmp/test_placement

      - name: Per-player line of sight
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_los.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_los
          /tmp/test_los

      - name: Save/load keeps the lockstep hash
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_save_hash.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_save_hash
          /tmp/test_save_hash

      - name: Diplomacy, tribute and AI fleets over the lockstep net
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_diplo_net.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp src/network/turn_manager.cpp \
            src/network/net_host.cpp -lpthread -o /tmp/test_diplo_net
          /tmp/test_diplo_net

      - name: Civ roster wiring tests
        run: |
          g++ -std=c++20 -O2 -Isrc tools/test_civ_units.cpp src/simulation/simulation.cpp \
            src/simulation/rms_generator.cpp src/core/job_system.cpp -lpthread -o /tmp/test_civ_units
          /tmp/test_civ_units
      - name: Flight tests (units/plane, UnitMotionFlying)
        run: |
